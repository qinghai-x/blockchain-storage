[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Supabase 同域代理：前端经本域转发到 Supabase，绕开部分网络无法直连 supabase.co 的问题
# 注意：代理规则必须放在 SPA 回退规则之前
[[redirects]]
  from = "/auth/v1/*"
  to = "https://jucuyjdoisfmgzhtcrux.supabase.co/auth/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/rest/v1/*"
  to = "https://jucuyjdoisfmgzhtcrux.supabase.co/rest/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/storage/v1/*"
  to = "https://jucuyjdoisfmgzhtcrux.supabase.co/storage/v1/:splat"
  status = 200
  force = true

# 单页应用路由配置
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 安全响应头
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # connect-src 已加入 https://*.supabase.co：接入 Supabase 后前端需向该域名发起 API 请求
    Content-Security-Policy = "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co"
